<svg xmlns="http://www.w3.org/2000/svg" width="122" height="20" role="img" aria-label="agent skill: included" viewBox="0 0 122 20">
  <title>agent skill: included</title>
  <!--One shared pink-to-orange gradient across the 777px README badge row.-->
  <defs>
    <linearGradient id="pink-orange" x1="-655" y1="0" x2="122" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f46aa6" />
      <stop offset="1" stop-color="#ff9b55" />
    </linearGradient>
  </defs>
  <g shape-rendering="crispEdges">
    <rect width="122" height="20" fill="url(#pink-orange)" />
  </g>
  <g fill="#382b32" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text x="345" y="140" textLength="570" transform="scale(.1)">agent skill</text>
    <text x="935" y="140" textLength="450" transform="scale(.1)">included</text>
  </g>
</svg>
