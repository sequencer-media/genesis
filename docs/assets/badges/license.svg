<svg xmlns="http://www.w3.org/2000/svg" width="120" height="20" role="img" aria-label="license: Apache 2.0" viewBox="0 0 120 20">
  <title>license: Apache 2.0</title>
  <!--One shared pink-to-orange gradient across the 777px README badge row.-->
  <defs>
    <linearGradient id="pink-orange" x1="-131" y1="0" x2="646" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f46aa6" />
      <stop offset="1" stop-color="#ff9b55" />
    </linearGradient>
  </defs>
  <g shape-rendering="crispEdges">
    <rect width="120" height="20" fill="url(#pink-orange)" />
  </g>
  <g fill="#382b32" text-anchor="middle" font-family="Verdana,Geneva,DejaVu Sans,sans-serif" text-rendering="geometricPrecision" font-size="110">
    <text x="245" y="140" textLength="370" transform="scale(.1)">license</text>
    <text x="825" y="140" textLength="630" transform="scale(.1)">Apache 2.0</text>
  </g>
</svg>
