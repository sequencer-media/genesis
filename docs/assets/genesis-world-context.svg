<svg xmlns="http://www.w3.org/2000/svg" width="960" height="760" viewBox="0 0 960 760" role="img" aria-labelledby="title description">
  <title id="title">GENESIS, a universal World Model Context Protocol</title>
  <desc id="description">GENESIS has a Context Engine that connects character memory, scenes, inventory, multiplayer, world settings and player actions to an external World Model. An external LLM creates prompts and structured replies. An optional external image model takes prompts from the LLM and supplies reference or starting images to the World Model when enabled by world settings. Models sit outside the GENESIS boundary and connect through adapters. Generated scenes pass through streaming delivery to the interactive UI, continuing the loop.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#a53861" stroke-width="1.4"/></marker>
  </defs>
  <style>
    text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;fill:#382b32}
    .title{font-size:24px;font-weight:700;letter-spacing:1px}
    .label{font-size:18px;font-weight:700}
    .detail{font-size:13px;fill:#75636b}
    .caption{font-size:13px;fill:#a53861}
    .node{fill:#f5f0e4;stroke:#bba49c;stroke-width:1}
    .adapter{fill:#f5f0e4;stroke:#a53861;stroke-width:1.3;stroke-dasharray:5 4}
    .external{stroke-width:1.5;stroke-dasharray:5 4}
    .llm{fill:#ffe8f1;stroke:#a53861}
    .world{fill:#fff0dd;stroke:#a45a2a}
    .flow{fill:none;stroke:#a53861;stroke-width:1.5;marker-end:url(#arrow)}
    .context{fill:none;stroke:#bba49c;stroke-width:1.2}
  </style>
  <rect width="960" height="760" fill="#f5f0e4"/>
  <path d="M24 20H936V208H334V454H936V592H24Z" fill="none" stroke="#382b32" stroke-width="1.5"/>
  <text x="52" y="56" class="title">GENESIS</text>
  <text x="52" y="81" class="detail">A universal World Model Context Protocol</text>
  <text x="918" y="58" text-anchor="end" class="caption">[ modular by design ]</text>

  <g text-anchor="middle">
    <rect x="52" y="106" width="200" height="76" class="node"/>
    <path d="M52 106H252" stroke="#f46aa6" stroke-width="2"/>
    <text x="152" y="137" class="label">Character memory</text>
    <text x="152" y="160" class="detail">History + relationships</text>
    <rect x="274" y="106" width="200" height="76" class="node"/>
    <path d="M274 106H474" stroke="#ff9b55" stroke-width="2"/>
    <text x="374" y="137" class="label">Scenes + places</text>
    <text x="374" y="160" class="detail">Locations + continuity</text>
    <rect x="496" y="106" width="200" height="76" class="node"/>
    <path d="M496 106H696" stroke="#f46aa6" stroke-width="2"/>
    <text x="596" y="137" class="label">Inventory</text>
    <text x="596" y="160" class="detail">Items + variables</text>
    <rect x="718" y="106" width="200" height="76" class="node"/>
    <path d="M718 106H918" stroke="#ff9b55" stroke-width="2"/>
    <text x="818" y="137" class="label">Multiplayer</text>
    <text x="818" y="160" class="detail">Seats + turns + votes</text>
  </g>
  <path class="context" d="M152 182V202H818V182M374 182V202M596 182V202"/>
  <path class="flow" d="M177 202V222"/>

  <g text-anchor="middle">
    <rect x="52" y="222" width="250" height="98" class="node"/>
    <text x="177" y="258" class="label">Context Engine</text>
    <text x="177" y="284" class="detail">State + rules</text>
    <text x="177" y="306" class="detail">World settings + context</text>
    <rect x="350" y="222" width="240" height="98" class="external llm"/>
    <text x="470" y="258" class="label">External LLM</text>
    <text x="470" y="284" class="detail">Prompts + typed replies</text>
    <text x="470" y="306" class="detail">Connected through an adapter</text>
    <rect x="648" y="222" width="270" height="98" class="external world"/>
    <text x="783" y="258" class="label">External World Model</text>
    <text x="783" y="284" class="detail">Generate the next scene</text>
    <text x="783" y="306" class="detail">Connected through an adapter</text>
  </g>
  <path class="flow" marker-start="url(#arrow)" d="M306 276H346"/>
  <text x="257" y="345" text-anchor="middle" class="caption">Context / replies</text>
  <path class="flow" d="M594 276H644"/>

  <path class="flow" d="M470 324V354"/>
  <text x="488" y="345" class="caption">Image prompt</text>
  <rect x="350" y="358" width="240" height="88" class="external world"/>
  <text x="470" y="390" text-anchor="middle" class="label">External image model</text>
  <text x="470" y="415" text-anchor="middle" class="detail">Optional, enabled in settings</text>
  <text x="470" y="437" text-anchor="middle" class="detail">Reference / starting images</text>
  <path class="flow" d="M594 402H720V324"/>
  <text x="650" y="424" text-anchor="middle" class="caption">Image input</text>
  <path class="flow" d="M177 324V464H795V324"/>
  <text x="619" y="478" text-anchor="middle" class="caption">World context + accepted outcome</text>

  <path class="flow" marker-start="url(#arrow)" d="M177 324V476"/>
  <text x="197" y="384" class="caption">Player actions</text>
  <rect x="52" y="480" width="352" height="82" class="node"/>
  <text x="228" y="509" text-anchor="middle" class="label">Interactive UI</text>
  <text x="228" y="533" text-anchor="middle" class="detail">Point and click + player controls</text>
  <text x="228" y="554" text-anchor="middle" class="detail">Inventory panels + overlays</text>
  <text x="448" y="503" class="label">Plug in the parts you need.</text>
  <text x="448" y="530" class="detail">GENESIS modules + external models.</text>
  <text x="448" y="553" class="detail">Your host connects the providers.</text>

  <path class="flow" d="M865 324V626"/>
  <text x="720" y="616" class="caption">Generated scene</text>
  <rect x="610" y="630" width="330" height="88" class="adapter"/>
  <text x="775" y="660" text-anchor="middle" class="label">Streaming delivery</text>
  <text x="775" y="684" text-anchor="middle" class="detail">Video to every viewer</text>
  <text x="775" y="706" text-anchor="middle" class="detail">Your stream / player adapter</text>
  <path class="flow" d="M606 674H228V566"/>
  <text x="413" y="655" text-anchor="middle" class="caption">Live video returns to the UI</text>
  <text x="52" y="746" class="detail">Inside the border: GENESIS. Tinted: external models. Below: delivery.</text>
</svg>
