<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;background:transparent;color:#fafafa;font:14px system-ui}*{box-sizing:border-box}.panel{position:absolute;bottom:16px;left:16px;right:16px;background:#111113ed;border:1px solid #3f3f46;border-radius:18px;padding:16px}button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid #52525b;background:#fafafa;color:#09090b;padding:10px 18px}button:disabled{opacity:.45;cursor:default}.choices{display:flex;gap:8px;flex-wrap:wrap}.note{color:#a1a1aa;font-size:12px;margin:8px 0}.meter{height:16px;background:#3f3f46;border-radius:20px;position:relative;overflow:hidden;margin:16px 0}.needle{width:4px;background:#fafafa;height:100%;position:absolute}input{accent-color:#fafafa;width:100%}.hidden{display:none}</style></head><body><div class="panel"><strong id="turn">Choose a move</strong><div id="options" class="choices"></div><p id="note" class="note"></p></div><script>Genesis.on('state',view=>{const state=view.genesis?.state||{},window=view.genesis?.window;document.getElementById('turn').textContent='Side '+((state.team||0)+1)+' chooses';const options=document.getElementById('options');options.replaceChildren();for(const option of window?.options||state.options||[]){const button=document.createElement('button');button.textContent=option.label+(view.genesis?.votedOptionId===option.id?' ✓':'');button.disabled=!Genesis.actions.get('choose').canSubmit;button.onclick=()=>Genesis.action('choose',{optionId:option.id}).catch(e=>document.getElementById('note').textContent=e.message);options.appendChild(button);}document.getElementById('note').textContent=window?.mode==='collective'?'Votes received: '+view.genesis.voteCount+' · '+Math.max(0,Math.ceil(((window?.deadline||Date.now())-Date.now())/1000))+'s left':'Players take turns.';});</script></body></html>
