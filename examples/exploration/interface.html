<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;background:transparent;color:#fafafa;font:14px system-ui}*{box-sizing:border-box}.panel{position:absolute;bottom:16px;left:16px;right:16px;background:#111113ed;border:1px solid #3f3f46;border-radius:18px;padding:16px}button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid #52525b;background:#fafafa;color:#09090b;padding:10px 18px}button:disabled{opacity:.45;cursor:default}.choices{display:flex;gap:8px;flex-wrap:wrap}.note{color:#a1a1aa;font-size:12px;margin:8px 0}.meter{height:16px;background:#3f3f46;border-radius:20px;position:relative;overflow:hidden;margin:16px 0}.needle{width:4px;background:#fafafa;height:100%;position:absolute}input{accent-color:#fafafa;width:100%}.hidden{display:none}</style></head><body><div class="panel"><strong>Explore this scene</strong><p id="note" class="note">Click a spot to move toward it.</p><button id="center">Move forward</button></div><script>const note=document.getElementById('note'),button=document.getElementById('center');let enabled=false;
Genesis.on('state',view=>{enabled=!!Genesis.actions.get('explore').canSubmit;button.disabled=!enabled;note.textContent=enabled?'Click a spot to move toward it.':'Preparing the next scene…';document.querySelector('.panel').style.opacity=view.genesis?.stage.overlays?'1':'0';});
document.body.addEventListener('click',event=>{if(event.target.closest('.panel')||!enabled)return;const point=Genesis.stage.point(event,document.body);if(point)Genesis.action('explore',point).catch(e=>note.textContent=e.message);});
button.onclick=()=>{const stage=Genesis.stage.get();Genesis.action('explore',{x:.5,y:.5,anchorId:stage.anchor.id,sceneRevision:stage.anchor.revision}).catch(e=>note.textContent=e.message);};</script></body></html>
