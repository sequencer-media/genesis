<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Pokémon Wildclash</title>
  <style>
    :root {
      --pixel-font: 'Press Start 2P', 'Silkscreen', 'Courier New', Monaco, 'Lucida Console', monospace;
      --bg-cream: #faf8e8;
      --bg-cream-dark: #f0ecd4;
      --border-dark: #182028;
      --frame-outer: #404860;
      --frame-highlight: #707898;
      --text-main: #181c24;
      --red-accent: #e52521;
      --blue-accent: #2b6bf3;
      --turn-gold: #f8b820;
      --hp-pill-border: #481808;
      --hp-pill-bg: #b84818;
      --hp-green-fill: #48d860;
      --hp-green-highlight: #a8f8b8;
      --hp-yellow-fill: #f8b820;
      --hp-yellow-highlight: #fff080;
      --hp-red-fill: #e83828;
      --hp-red-highlight: #ff9890;
      --exp-blue: #40a0f8;
      --font-scale: 1;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: var(--pixel-font);
      background: transparent;
      color: var(--text-main);
      font-size: clamp(8px, 1.35vw, 11px);
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      image-rendering: pixelated;
      text-rendering: geometricPrecision;
      -webkit-font-smoothing: none;
      -moz-osx-font-smoothing: grayscale;
    }

    .handheld-stage {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      pointer-events: none;
      padding: clamp(3px, 1vw, 8px);
    }

    .interactive {
      pointer-events: auto;
    }

    /* Stepped Pixel Corners */
    .pixel-cut {
      clip-path: polygon(
        0 3px, 1px 3px, 1px 1px, 3px 1px, 3px 0,
        calc(100% - 3px) 0, calc(100% - 3px) 1px, calc(100% - 1px) 1px, calc(100% - 1px) 3px, 100% 3px,
        100% calc(100% - 3px), calc(100% - 1px) calc(100% - 3px), calc(100% - 1px) calc(100% - 1px), calc(100% - 3px) calc(100% - 1px), calc(100% - 3px) 100%,
        3px 100%, 3px calc(100% - 1px), 1px calc(100% - 1px), 1px calc(100% - 3px), 0 calc(100% - 3px)
      );
    }

    /* Low-Pixel Stepped Corner Effect for Bottom Container */
    .pixel-cut-stepped {
      clip-path: polygon(
        0 4px, 2px 4px, 2px 2px, 4px 2px, 4px 0,
        calc(100% - 4px) 0, calc(100% - 4px) 2px, calc(100% - 2px) 2px, calc(100% - 2px) 4px, 100% 4px,
        100% calc(100% - 4px), calc(100% - 2px) calc(100% - 4px), calc(100% - 2px) calc(100% - 2px), calc(100% - 4px) calc(100% - 2px), calc(100% - 4px) 100%,
        4px 100%, 4px calc(100% - 2px), 2px calc(100% - 2px), 2px calc(100% - 4px), 0 calc(100% - 4px)
      );
    }

    /* Authentic GBA Stepped Pixel Cutout for HP Parchment Cards */
    .pixel-cut-hp {
      clip-path: polygon(
        0 6px, 2px 6px, 2px 4px, 4px 4px, 4px 2px, 6px 2px, 6px 0,
        calc(100% - 6px) 0, calc(100% - 4px) 2px, calc(100% - 2px) 4px, 100% 6px,
        100% calc(100% - 6px), calc(100% - 2px) calc(100% - 4px), calc(100% - 4px) calc(100% - 2px), calc(100% - 6px) 100%,
        6px 100%, 4px calc(100% - 2px), 2px calc(100% - 4px), 0 calc(100% - 6px)
      );
    }

    /* TOP BAR: CLEAN NOTIFICATION BANNER */
    .top-control-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      pointer-events: auto;
      z-index: 20;
    }

    /* TOP-RIGHT CORNER COMPACT UI VIEW SWITCHER */
    .perspective-switcher-corner {
      position: absolute;
      top: clamp(4px, 0.8vw, 8px);
      right: clamp(4px, 0.8vw, 8px);
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(16, 20, 28, 0.92);
      border: 1.5px solid #283040;
      padding: 2.5px 4px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
      z-index: 50;
      pointer-events: auto;
    }

    .perspective-title {
      font-size: clamp(6.5px, 0.85vw, 8px);
      color: #9cb0c8;
      letter-spacing: 0.5px;
      margin-right: 2px;
      white-space: nowrap;
    }

    .view-btn {
      font-family: var(--pixel-font);
      font-size: clamp(6.5px, 0.85vw, 8px);
      font-weight: 900;
      padding: clamp(2px, 0.4vw, 3.5px) clamp(4px, 0.7vw, 7px);
      background: #202838;
      color: #d0d8e8;
      border: 1px solid #384860;
      cursor: pointer;
      line-height: 1;
      display: flex;
      align-items: center;
      gap: 3px;
      transition: all 0.15s ease;
    }
    .view-btn:hover {
      background: #303c54;
      color: #fff;
    }
    .view-btn.active {
      background: #ffd838;
      color: #10141c;
      border-color: #ffe870;
      box-shadow: 0 0 6px rgba(255, 216, 56, 0.6);
      transform: scale(1.03);
    }
    .view-btn.view-spec.active {
      background: #48bb78;
      color: #fff;
      border-color: #68d391;
      box-shadow: 0 0 6px rgba(72, 187, 120, 0.7);
    }
    .view-btn.view-p1.active {
      background: #e52521;
      color: #fff;
      border-color: #ff7070;
      box-shadow: 0 0 6px rgba(229, 37, 33, 0.7);
    }
    .view-btn.view-p2.active {
      background: #2b6bf3;
      color: #fff;
      border-color: #70a0ff;
      box-shadow: 0 0 6px rgba(43, 107, 243, 0.7);
    }

    /* Turn Notification Badge - Classic GBA Battle Off-White Prompt Box */
    .turn-badge {
      background: var(--bg-cream);
      border: 2px solid var(--border-dark);
      padding: clamp(3px, 0.6vw, 5px) clamp(10px, 1.8vw, 16px);
      font-size: clamp(8px, 1.2vw, 10.5px);
      font-weight: 900;
      letter-spacing: 0.5px;
      color: var(--text-main);
      box-shadow: 2px 2px 0 #182028;
      display: flex;
      align-items: center;
      gap: 6px;
      transform: scaleY(1.18);
      transform-origin: center;
    }
    .turn-badge.active-turn {
      background: #ffffff;
      border-color: #283038;
      color: #182028;
      box-shadow: 2px 2px 0 #182028, inset 0 0 0 1px #48d860;
    }
    .turn-badge.turn-t1 {
      border-color: #981c1c;
      box-shadow: 2px 2px 0 #182028, inset 0 0 0 1.5px #e52521;
    }
    .turn-badge.turn-t2 {
      border-color: #1a4098;
      box-shadow: 2px 2px 0 #182028, inset 0 0 0 1.5px #2b6bf3;
    }
    .turn-badge.waiting-turn {
      background: #f4f0dc;
      color: #485060;
      border-color: #283038;
    }
    .turn-badge .turn-dot {
      width: 7px;
      height: 7px;
      background: #e52521;
      border: 1px solid #182028;
      border-radius: 1px;
      flex-shrink: 0;
      animation: pulseDot 1s infinite alternate;
    }
    @keyframes pulseDot {
      from { opacity: 0.4; }
      to { opacity: 1; }
    }

    /* BATTLE SCREEN: HP STATUS CARDS AREA */
    .battle-hud-area {
      position: relative;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin: 4px 0;
      min-height: 80px;
    }

    /* Opponent Column (Top-Left) */
    .trainer-column-opponent {
      position: absolute;
      top: 0;
      left: 0;
      align-self: flex-start;
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: clamp(160px, 45vw, 240px);
    }

    /* Status Card Shadow Plates: Emerald Authentic Slanted Polygon Wedge - NO BORDER */
    .hp-shadow-plate {
      position: absolute;
      background: #000000;
      opacity: 0.5;
      border: none !important;
      z-index: 1;
      pointer-events: none;
    }
    /* Opponent shadow: extends slightly behind top-left card, points softly to bottom-right toward arena */
    .hp-shadow-opp {
      top: 4px;
      left: -3px;
      right: -8px;
      bottom: -6px;
      clip-path: polygon(
        0% 0%,
        calc(100% - 12px) 0%,
        100% 40%,
        calc(100% - 6px) 100%,
        12px 100%,
        0% calc(100% - 6px)
      );
    }
    /* Player shadow: Emerald Wedge! Points sharply down to bottom-left corner and slants up to middle of health container */
    .hp-shadow-player {
      top: 0px;
      left: -22px;
      right: -4px;
      bottom: -6px;
      clip-path: polygon(
        24px 0%,
        100% 0%,
        100% 100%,
        16px 100%,
        0% 100%,
        2px 90%,
        22px 50%,
        24px 0%
      );
    }

    .hp-card-wrapper {
      position: relative;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    .hp-box-opponent {
      background: var(--bg-cream);
      border: 2px solid var(--border-dark);
      padding: clamp(3px, 0.8vw, 6px) clamp(6px, 1vw, 9px);
      position: relative;
      z-index: 2;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .hp-box-opponent.active-turn-ring {
      border: 2px solid #e52521;
      box-shadow: 0 0 7px rgba(229, 37, 33, 0.6);
    }

    /* Player Column (Bottom-Right) */
    .trainer-column-player {
      position: absolute;
      bottom: 0;
      right: 0;
      align-self: flex-end;
      display: flex;
      flex-direction: column;
      gap: 3px;
      width: clamp(170px, 47vw, 250px);
    }

    .hp-box-player-wrapper {
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .hp-box-player {
      background: var(--bg-cream);
      border: 2px solid var(--border-dark);
      padding: clamp(3px, 0.8vw, 6px) clamp(6px, 1vw, 9px) 3px clamp(6px, 1vw, 9px);
      position: relative;
      z-index: 2;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    .hp-box-player.active-turn-ring {
      border: 2px solid #2b6bf3;
      box-shadow: 0 0 7px rgba(43, 107, 243, 0.6);
    }

    .hp-box-header {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      margin-bottom: 2px;
    }
    .pokemon-title {
      font-size: clamp(11px, 1.6vw, 14.5px);
      font-weight: 900;
      color: var(--text-main);
      display: flex;
      align-items: baseline;
      gap: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      transform: scaleY(1.25);
      transform-origin: left center;
    }
    .gender-badge {
      font-size: clamp(10px, 1.4vw, 13px);
      font-weight: 900;
    }
    .gender-male { color: #3068e8; }
    .gender-female { color: #e84870; }
    .level-badge {
      font-size: clamp(10px, 1.4vw, 13px);
      font-weight: 900;
      color: var(--text-main);
      white-space: nowrap;
      margin-left: 3px;
      transform: scaleY(1.25);
      transform-origin: right center;
    }

    /* Integrated HP Container: HP text inside the same container with the actual health bar! */
    .hp-gauge-integrated {
      display: flex;
      align-items: center;
      gap: 3.5px;
      background: #10141c;
      border: 1.5px solid #1c2430;
      border-radius: 3px;
      padding: 1.5px 3px;
      margin-top: 2px;
      box-shadow: inset 1px 1px 0 rgba(0,0,0,0.5);
    }
    .hp-label-integrated {
      font-family: var(--pixel-font);
      font-size: clamp(6px, 0.8vw, 7.5px);
      font-weight: 900;
      color: #ff9820;
      background: #281810;
      border: 1px solid #382418;
      border-radius: 2px;
      padding: 0.5px 2.5px;
      line-height: 1;
      letter-spacing: 0.4px;
      transform: scaleY(0.82);
      transform-origin: center;
      display: inline-block;
      flex-shrink: 0;
    }
    .hp-track-integrated {
      flex: 1;
      height: clamp(8px, 1.3vw, 11px);
      background: #0a0e14;
      border-radius: 2px;
      overflow: hidden;
      position: relative;
    }
    .hp-fill {
      height: 100%;
      width: 100%;
      background: linear-gradient(to bottom, #a8f8b8 0%, #48d860 100%);
      transition: width 0.3s ease;
    }

    .hp-numbers-display {
      font-size: clamp(10px, 1.4vw, 13px);
      font-weight: 900;
      color: var(--text-main);
      text-align: right;
      letter-spacing: 0.5px;
      margin-top: 2px;
      line-height: 1;
      transform: scaleY(1.25);
      transform-origin: right center;
    }

    /* EXP Bar Tab - Emerald Slanted Base with Thick Blue Bar */
    .exp-footer-tab {
      background: #202838;
      border: 2px solid var(--border-dark);
      margin-top: 1px;
      margin-left: 12px;
      box-shadow: none;
      padding: 3px 8px 4px 8px;
      display: flex;
      align-items: center;
      gap: 5px;
      position: relative;
      z-index: 2;
    }
    .exp-label {
      font-size: clamp(8px, 1.1vw, 10px);
      font-weight: 900;
      color: #ffd838;
      line-height: 1;
      transform: scaleY(1.25);
      transform-origin: left center;
    }
    .exp-track {
      flex: 1;
      height: clamp(6px, 0.95vw, 8.5px);
      background: #0e141c;
      border: 1.5px solid #080c12;
      overflow: hidden;
      border-radius: 1px;
    }
    .exp-fill {
      height: 100%;
      width: 65%;
      background: linear-gradient(180deg, #60e0f8 0%, #0898e0 50%, #0068b0 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.4);
    }

    /* REVAMPED RETRO ARCADE JOIN BUTTONS */
    .seat-sub-btn-cute {
      font-family: var(--pixel-font);
      font-size: clamp(9px, 1.25vw, 11px);
      font-weight: 900;
      padding: clamp(4px, 0.7vw, 6px) clamp(8px, 1.4vw, 14px);
      color: #ffffff;
      border: 2px solid var(--border-dark);
      box-shadow: 2px 2px 0 #182028;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      text-align: center;
      width: auto;
      max-width: 82%;
      margin: 0 auto 4px;
      align-self: center;
      line-height: 1.2;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      position: relative;
      overflow: hidden;
      transform: scaleY(1.18);
      transform-origin: center;
      transition: all 0.15s ease;
    }

    .seat-join-icon {
      font-size: clamp(9px, 1.3vw, 12px);
      line-height: 1;
      flex-shrink: 0;
    }

    .seat-sub-btn-cute.trainer-red-btn {
      border-color: #580c0c;
      background: linear-gradient(180deg, #e52521 0%, #b81414 100%);
      color: #ffffff;
      text-shadow: 1px 1px 0 #4a0000;
      animation: cuteRedPulse 2s infinite ease-in-out;
    }
    .seat-sub-btn-cute.trainer-blue-btn {
      border-color: #0c2058;
      background: linear-gradient(180deg, #2b6bf3 0%, #1646b8 100%);
      color: #ffffff;
      text-shadow: 1px 1px 0 #00144a;
      animation: cuteBluePulse 2s infinite ease-in-out;
    }

    @keyframes cuteRedPulse {
      0%, 100% { box-shadow: 2px 2px 0 #182028, 0 0 0 rgba(229, 37, 33, 0); }
      50% { box-shadow: 2px 2px 0 #182028, 0 0 8px rgba(229, 37, 33, 0.6); }
    }
    @keyframes cuteBluePulse {
      0%, 100% { box-shadow: 2px 2px 0 #182028, 0 0 0 rgba(43, 107, 243, 0); }
      50% { box-shadow: 2px 2px 0 #182028, 0 0 8px rgba(43, 107, 243, 0.6); }
    }

    .seat-sub-btn-cute:hover:not(:disabled) {
      filter: brightness(1.1);
      transform: scaleY(1.18) translateY(-1px);
    }
    .seat-sub-btn-cute:active:not(:disabled) {
      transform: scaleY(1.18) translate(1px, 1px);
      box-shadow: 1px 1px 0 #182028;
    }
    .seat-sub-btn-cute:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      animation: none !important;
    }
    .seat-sub-btn-cute.occupied {
      background: #28303c;
      border-color: #485060;
      color: #8c98a8;
      text-shadow: none;
      animation: none !important;
    }
    /* When connected/playing: animation STOPS completely and status is crystal clear */
    .seat-sub-btn-cute.playing-active {
      background: #18261e !important;
      border-color: #48d860 !important;
      color: #58f078 !important;
      text-shadow: 0 0 4px rgba(72, 216, 96, 0.5) !important;
      animation: none !important;
      box-shadow: 2px 2px 0 #101814, inset 0 0 6px rgba(72, 216, 96, 0.25) !important;
    }
    .seat-sub-btn-cute.leave {
      background: #2a1418 !important;
      border-color: #d84848 !important;
      color: #ff9898 !important;
      text-shadow: none !important;
      animation: none !important;
    }

    /* VINTAGE GBA LOWER DECK (BATTLE / CONTROL AREA) WITH LOW-PIXEL CORNERS */
    /* VINTAGE GBA LOWER DECK (BATTLE / CONTROL AREA) WITH LOW-PIXEL CORNERS */
    .gba-deck-outer {
      background: #181c28;
      padding: 2px;
      max-width: 440px;
      width: 100%;
      margin: 0 auto;
      box-shadow: 2px 2px 0 #10141c;
      transition: all 0.2s ease;
    }

    .gba-deck-frame {
      background: var(--frame-outer);
      box-shadow: inset 0 0 0 1.5px var(--frame-highlight);
      padding: clamp(2.5px, 0.6vw, 4px);
      display: flex;
      gap: clamp(2.5px, 0.6vw, 4px);
      width: 100%;
      height: auto;
    }

    .deck-play-center {
      flex: 1;
      display: flex;
      gap: clamp(2.5px, 0.6vw, 4px);
      align-items: stretch;
    }

    /* Left Panel: 2x2 Move List with Authentic Red Highlight Box - EXACTLY 2 TEXT ROWS TALL */
    .gba-moves-panel {
      flex: 1;
      background: var(--bg-cream);
      border: 1.5px solid var(--border-dark);
      box-shadow: inset 1px 1px 0 #ffffff;
      padding: clamp(2px, 0.5vw, 4px) clamp(4px, 0.8vw, 6px);
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: auto auto;
      gap: clamp(1px, 0.3vw, 2px) clamp(3px, 0.8vw, 6px);
      align-items: center;
    }

    .gba-move-item {
      display: flex;
      align-items: center;
      gap: 3px;
      padding: clamp(1.5px, 0.4vw, 3px);
      cursor: pointer;
      color: var(--text-main);
      border: 1.5px solid transparent;
      border-radius: 3px;
      white-space: nowrap;
      overflow: hidden;
      line-height: 1.1;
      position: relative;
    }

    /* Exactly like GBA Emerald screenshot: red rectangular border box with slight rounded pixelated corners */
    .gba-move-item.selected {
      border: 1.5px solid var(--red-accent);
      border-radius: 3px;
      background: #fffbe8;
      box-shadow: inset 0 0 0 1px #ffc0c0;
    }
    .gba-move-item.disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .move-arrow {
      color: var(--red-accent);
      font-size: clamp(6.5px, 0.9vw, 8.5px);
      visibility: hidden;
      line-height: 1;
    }
    .gba-move-item.selected .move-arrow {
      visibility: visible;
    }

    /* Move text in authentic stretched pixel style */
    .gba-move-text {
      font-size: clamp(8px, 1.25vw, 11px);
      font-weight: 900;
      letter-spacing: 0.3px;
      display: inline-block;
      transform: scaleY(1.3);
      transform-origin: left center;
    }

    /* Right Panel: PP & TYPE Specs matching GBA Reference (MINIMUM WIDTH) */
    .gba-stats-panel {
      flex: 0 0 auto;
      width: auto;
      min-width: clamp(62px, 16vw, 82px);
      background: var(--bg-cream);
      border: 1.5px solid var(--border-dark);
      box-shadow: inset 1px 1px 0 #ffffff;
      padding: clamp(2px, 0.5vw, 4px) clamp(3.5px, 0.8vw, 5px);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1px;
    }

    .gba-pp-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      font-size: clamp(7.5px, 1.1vw, 9.5px);
      font-weight: 900;
    }
    .gba-pp-label {
      color: #586070;
      font-size: clamp(7px, 1vw, 9px);
      letter-spacing: 0.5px;
    }
    .gba-pp-val {
      color: var(--text-main);
      font-size: clamp(8px, 1.2vw, 10.5px);
      font-weight: 900;
      letter-spacing: 0.5px;
    }

    .gba-type-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(7px, 1vw, 9px);
      margin-top: 1px;
    }
    .gba-type-badge {
      font-size: clamp(7px, 1vw, 9px);
      font-weight: 900;
      padding: 1.5px 4px;
      border-radius: 2px;
      color: #fff;
      border: 1px solid rgba(0,0,0,0.3);
      text-transform: uppercase;
      line-height: 1;
      letter-spacing: 0.4px;
    }

    .gba-strike-btn {
      margin-top: 2px;
      background: var(--red-accent);
      color: #fff;
      font-family: var(--pixel-font);
      font-size: clamp(7.5px, 1.1vw, 10px);
      font-weight: 900;
      border: 1.5px solid #801818;
      border-radius: 2px;
      padding: clamp(2.5px, 0.5vw, 4px) 0;
      cursor: pointer;
      text-align: center;
      box-shadow: 1px 1px 0 #000;
      line-height: 1;
      letter-spacing: 0.5px;
      transition: all 0.1s;
    }
    .gba-strike-btn:hover:not(:disabled) {
      filter: brightness(1.1);
    }
    .gba-strike-btn:active:not(:disabled) {
      transform: translate(1px, 1px);
      box-shadow: none;
    }
    .gba-strike-btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    /* SIDE ACTION COLUMN: FIGHT, BAG */
    .gba-side-actions {
      width: clamp(38px, 8.5vw, 50px);
      display: flex;
      flex-direction: column;
      gap: 2px;
    }
    .gba-side-btn {
      flex: 1;
      background: var(--bg-cream);
      border: 1.5px solid var(--border-dark);
      color: var(--text-main);
      font-family: var(--pixel-font);
      font-size: clamp(7px, 1vw, 9px);
      font-weight: 900;
      cursor: pointer;
      box-shadow: 1px 1px 0 #000;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 2px;
      line-height: 1;
    }
    .gba-side-btn:active {
      transform: translate(1px, 1px);
      box-shadow: none;
    }
    .gba-side-btn.active {
      background: #e8e2c0;
      border-color: var(--red-accent);
    }

    /* SPECTATOR BROADCAST PANEL (Used when in Spectator view) */
    .gba-spectator-panel {
      display: none;
      flex: 1;
      background: var(--bg-cream);
      border: 2px solid var(--border-dark);
      padding: clamp(3px, 0.8vw, 6px);
      flex-direction: column;
      justify-content: space-between;
    }
    .spectator-headline {
      font-size: clamp(7.5px, 1.1vw, 9.5px);
      color: #982828;
      font-weight: 900;
      display: flex;
      align-items: center;
      gap: 5px;
      margin-bottom: 2px;
    }
    .spectator-feed-text {
      font-size: clamp(7px, 1vw, 8.5px);
      line-height: 1.3;
      color: var(--text-main);
      overflow: hidden;
      text-overflow: ellipsis;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    /* Bag Drawer */
    .gba-bag-drawer {
      display: none;
      flex: 1;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      background: var(--bg-cream);
      border: 1.5px solid var(--border-dark);
      padding: 3px;
      max-height: 64px;
      overflow-x: hidden;
      overflow-y: hidden;
    }
    .gba-item-card {
      background: var(--bg-cream-dark);
      border: 1.5px solid var(--border-dark);
      padding: 2.5px 3.5px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1.5px;
      position: relative;
      transition: all 0.1s ease;
    }
    .gba-item-card:hover:not(.disabled) {
      background: #fffbe0;
      border-color: var(--red-accent);
    }
    .gba-item-card.disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .gba-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 2px;
    }
    .gba-item-name {
      font-size: clamp(6.5px, 0.95vw, 8px);
      font-weight: 900;
      color: var(--text-main);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gba-item-tag {
      font-size: clamp(5.5px, 0.75vw, 6.5px);
      padding: 1px 3px;
      border-radius: 2px;
      color: #fff;
      background: #486088;
      white-space: nowrap;
      line-height: 1;
    }
    .gba-item-tag.tag-ai {
      background: linear-gradient(135deg, #a838e8 0%, #e83890 100%);
      font-weight: 900;
      letter-spacing: 0.3px;
    }
    .gba-item-desc {
      font-size: clamp(6px, 0.8vw, 7px);
      color: #485060;
      line-height: 1.15;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .gba-item-action-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1px;
    }
    .gba-item-count {
      font-size: clamp(6.5px, 0.85vw, 8px);
      color: var(--text-main);
      font-weight: 900;
    }
    .gba-item-use-btn {
      font-family: var(--pixel-font);
      font-size: clamp(6.5px, 0.85vw, 8px);
      font-weight: 900;
      background: #288038;
      color: #fff;
      border: 1px solid #14481c;
      padding: 1.5px 4px;
      cursor: pointer;
      box-shadow: 1px 1px 0 #000;
      line-height: 1;
    }
    .gba-item-use-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      box-shadow: none;
    }
    .bag-empty-notice {
      grid-column: 1 / -1;
      text-align: center;
      padding: 8px;
      font-size: 7.5px;
      color: #707888;
    }

    .gba-log-drawer {
      display: none;
      flex: 1;
      background: var(--bg-cream);
      border: 2px solid var(--border-dark);
      padding: 4px 6px;
      max-height: 60px;
      overflow-y: auto;
      font-size: clamp(7px, 1vw, 8.5px);
      line-height: 1.35;
      color: var(--text-main);
    }
    .gba-log-drawer p { margin: 0 0 3px 0; }
    .gba-log-drawer p:last-child { color: var(--red-accent); }

    /* TYPE BADGE PALETTE */
    .type-FIRE { background: #ee7f30; }
    .type-WATER { background: #5c8cf5; }
    .type-GRASS { background: #6dbb3d; }
    .type-ELECTRIC { background: #dca700; color: #111; }
    .type-NORMAL { background: #9fa18a; }
    .type-ICE { background: #78c0c8; color: #111; }
    .type-FIGHTING { background: #b8332a; }
    .type-POISON { background: #964295; }
    .type-GROUND { background: #ce9d41; }
    .type-FLYING { background: #9c84e8; }
    .type-PSYCHIC { background: #eb4870; }
    .type-GHOST { background: #625088; }
    .type-DRAGON { background: #5d31d9; }
    .type-STEEL { background: #8f98a8; }
    .type-DARK { background: #614a3e; }

    /* MOBILE & COMPACT VIEWPORT OPTIMIZATIONS */
    @media (max-width: 480px), (max-height: 480px) {
      .handheld-stage { padding: 3px; }
      .perspective-switcher-corner { padding: 2px 3px; gap: 2px; }
      .view-btn { padding: 2px 4px; font-size: 6.5px; }
      .turn-badge { font-size: 7.5px; padding: 2.5px 6px; }
      .trainer-column-opponent { width: 47%; max-width: 170px; }
      .trainer-column-player { width: 49%; max-width: 180px; }
      .seat-sub-btn-cute { font-size: 8px; padding: 4px 6px; gap: 4px; }
      .pokeball-cute-icon { width: 11px; height: 11px; }
      .gba-deck-outer { padding: 2px; }
      .gba-deck-frame { padding: 2.5px; gap: 2.5px; min-height: 50px; }
      .gba-move-text { font-size: 8.5px; }
      .gba-stats-panel { padding: 3px 4px; }
      .gba-side-actions { width: 38px; }
      .gba-side-btn { font-size: 7px; }
    }

    @media (max-width: 360px) {
      .perspective-title { display: none; }
      .view-btn { font-size: 6px; padding: 1.5px 3px; }
      .seat-sub-btn-cute { font-size: 7.5px; }
      .gba-move-text { font-size: 7.5px; }
    }
    /* Reference HUD: narrow pixel lettering, stepped frames and compact status plates. */
    :root {
      --pixel-font: 'VT323', 'Courier New', monospace;
      --bg-cream: #f8f8e0;
      --bg-cream-dark: #eeeecf;
      --border-dark: #303c30;
      --frame-outer: #585870;
      --frame-highlight: #9890b0;
      --text-main: #404848;
      --hud-step: 2px;
    }
    html, body, button {
      font-weight: 400;
      font-synthesis: none;
      letter-spacing: 0;
      text-rendering: optimizeSpeed;
    }
    .handheld-stage { padding: 8px; }
    .pixel-cut-hp {
      clip-path: polygon(
        0 8px, 2px 8px, 2px 4px, 4px 4px, 4px 2px, 8px 2px, 8px 0,
        calc(100% - 8px) 0, calc(100% - 8px) 2px, calc(100% - 4px) 2px,
        calc(100% - 4px) 4px, calc(100% - 2px) 4px, calc(100% - 2px) 8px, 100% 8px,
        100% calc(100% - 8px), calc(100% - 2px) calc(100% - 8px),
        calc(100% - 2px) calc(100% - 4px), calc(100% - 4px) calc(100% - 4px),
        calc(100% - 4px) calc(100% - 2px), calc(100% - 8px) calc(100% - 2px),
        calc(100% - 8px) 100%, 8px 100%, 8px calc(100% - 2px),
        4px calc(100% - 2px), 4px calc(100% - 4px), 2px calc(100% - 4px),
        2px calc(100% - 8px), 0 calc(100% - 8px)
      );
    }
    .trainer-column-opponent { width: min(42%, 300px); gap: 6px; }
    .trainer-column-player { width: min(44%, 320px); gap: 6px; }
    .hp-box-opponent, .hp-box-player,
    .hp-box-opponent.active-turn-ring, .hp-box-player.active-turn-ring {
      isolation: isolate;
      border: 0;
      background: var(--border-dark);
      padding: 8px 14px 6px;
      box-shadow: none;
    }
    .hp-box-opponent::before, .hp-box-player::before {
      content: '';
      position: absolute;
      inset: 3px;
      z-index: -1;
      background: var(--bg-cream);
      box-shadow: inset 2px 2px 0 #e0e8c8, inset -2px -2px 0 #c8c8b0;
      clip-path: polygon(
        0 4px, 2px 4px, 2px 2px, 4px 2px, 4px 0,
        calc(100% - 4px) 0, calc(100% - 4px) 2px, calc(100% - 2px) 2px,
        calc(100% - 2px) 4px, 100% 4px, 100% calc(100% - 4px),
        calc(100% - 2px) calc(100% - 4px), calc(100% - 2px) calc(100% - 2px),
        calc(100% - 4px) calc(100% - 2px), calc(100% - 4px) 100%,
        4px 100%, 4px calc(100% - 2px), 2px calc(100% - 2px),
        2px calc(100% - 4px), 0 calc(100% - 4px)
      );
    }
    .hp-box-header { gap: 8px; margin: 0 0 4px; align-items: center; }
    .pokemon-title, .level-badge, .hp-numbers-display {
      font-size: 26px;
      line-height: 1;
      font-weight: 400;
      transform: none;
      text-shadow: 1px 1px 0 #b8b8a8;
    }
    .pokemon-title { min-width: 0; gap: 3px; }
    .level-badge { font-size: 24px; margin: 0; flex-shrink: 0; }
    .gender-badge { font-size: 18px; font-weight: 400; text-shadow: none; }
    .gender-male { color: #58a8c8; }
    .hp-gauge-integrated {
      width: 80%;
      margin: 0 0 0 auto;
      height: 16px;
      padding: 2px 3px;
      gap: 5px;
      border: 2px solid #606858;
      border-radius: 0;
      background: #404848;
      box-shadow: 0 1px 0 #f8f8e0;
      clip-path: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0,
        calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px),
        calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%,
        2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
    }
    .hp-label-integrated {
      font-size: 14px;
      line-height: 1;
      font-weight: 400;
      letter-spacing: 0;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: #f8a860;
      text-shadow: 1px 1px 0 #986848;
      transform: none;
    }
    .hp-track-integrated {
      height: 8px;
      border: 1px solid #e8f0d8;
      border-radius: 0;
      background: #485058;
    }
    .hp-numbers-display { margin: 3px 0 0; letter-spacing: 0; }
    .hp-shadow-plate { background: #000000; opacity: 0.5; }
    .hp-shadow-player {
      top: auto;
      height: 36px;
      bottom: -2px;
      left: -24px;
      right: -8px;
      clip-path: polygon(
        24px 0, calc(100% - 6px) 0, calc(100% - 6px) 4px, 100% 4px,
        100% calc(100% - 8px), calc(100% - 2px) calc(100% - 8px),
        calc(100% - 2px) calc(100% - 4px), calc(100% - 6px) calc(100% - 4px),
        calc(100% - 6px) 100%, 0 100%, 0 calc(100% - 4px),
        4px calc(100% - 4px), 4px calc(100% - 8px), 8px calc(100% - 8px),
        8px calc(100% - 12px), 12px calc(100% - 12px),
        12px calc(100% - 16px), 16px calc(100% - 16px),
        16px calc(100% - 20px), 20px calc(100% - 20px), 20px 0
      );
    }
    .hp-shadow-opp {
      top: auto;
      height: 26px;
      bottom: -6px;
      left: 0;
      right: -12px;
      clip-path: polygon(0 0, calc(100% - 12px) 0, calc(100% - 12px) 4px,
        calc(100% - 8px) 4px, calc(100% - 8px) 8px,
        calc(100% - 4px) 8px, calc(100% - 4px) 12px, 100% 12px,
        100% calc(100% - 4px), calc(100% - 4px) calc(100% - 4px),
        calc(100% - 4px) 100%, 8px 100%, 8px calc(100% - 4px),
        4px calc(100% - 4px), 4px calc(100% - 8px), 0 calc(100% - 8px));
    }
    .exp-footer-tab {
      height: 14px;
      margin: 0 5px 0 34px;
      padding: 0;
      gap: 8px;
      border: 0;
      background: transparent;
      clip-path: none;
    }
    .exp-label { font-size: 14px; font-weight: 400; color: #e8dc68; transform: none; }
    .exp-track { height: 7px; border: 1px solid #283830; border-radius: 0; background: #909878; }
    .exp-fill { background: linear-gradient(#70d8f0 0 40%, #38b8d8 40% 100%); box-shadow: none; }

    .gba-deck-outer {
      max-width: 680px;
      padding: 3px;
      background: #303038;
      box-shadow: 2px 2px 0 #202028;
    }
    .gba-deck-frame { padding: 5px; gap: 5px; box-shadow: inset 2px 2px 0 #787890, inset -2px -2px 0 #383848; }
    .deck-play-center { gap: 5px; min-width: 0; }
    .gba-moves-panel, .gba-stats-panel {
      background: #f8f8f0;
      border: 2px solid #303038;
      box-shadow: inset 2px 2px 0 #c0b8d0, inset -2px -2px 0 #e0e0d8;
      padding: 5px;
    }
    .gba-moves-panel { min-width: 0; grid-template-columns: 1.1fr 1fr; gap: 2px 4px; }
    .gba-move-item, .gba-move-item.selected {
      appearance: none;
      font-family: var(--pixel-font);
      width: 100%;
      min-width: 0;
      min-height: 32px;
      padding: 4px 6px;
      border: 0;
      border-radius: 0;
      background: transparent;
      text-align: left;
      clip-path: polygon(0 2px, 2px 2px, 2px 0, calc(100% - 2px) 0,
        calc(100% - 2px) 2px, 100% 2px, 100% calc(100% - 2px),
        calc(100% - 2px) calc(100% - 2px), calc(100% - 2px) 100%,
        2px 100%, 2px calc(100% - 2px), 0 calc(100% - 2px));
    }
    .gba-move-item.selected { box-shadow: inset 0 0 0 2px #d88880, inset 0 0 0 4px #f8d0c8; }
    .gba-move-item:focus-visible { outline: none; box-shadow: inset 0 0 0 2px #b85850, inset 0 0 0 4px #f8d0c8; }
    .move-arrow { display: none; }
    .gba-move-text { font-size: 24px; font-weight: 400; letter-spacing: 0; transform: scaleY(1.08); text-shadow: 1px 1px 0 #b8b8b0; }
    .gba-stats-panel { width: 126px; min-width: 126px; gap: 2px; }
    .gba-pp-row, .gba-type-row { justify-content: flex-start; gap: 8px; }
    .gba-pp-label, .gba-pp-val { font-size: 23px; font-weight: 400; color: var(--text-main); letter-spacing: 0; text-shadow: 1px 1px 0 #b8b8b0; }
    .gba-type-row > .gba-pp-label { display: none; }
    .gba-type-badge {
      font-size: 23px;
      font-weight: 400;
      padding: 0;
      border: 0;
      border-radius: 0;
      background: transparent;
      color: var(--text-main);
      letter-spacing: 0;
      line-height: 1;
      text-shadow: 1px 1px 0 #b8b8b0;
    }
    .gba-strike-btn { margin-top: 3px; font-size: 16px; font-weight: 400; padding: 3px 0; border: 2px solid #a05850; border-radius: 0; background: #c86860; box-shadow: none; }
    .gba-side-actions { width: 56px; gap: 4px; }
    .gba-side-btn { font-size: 18px; font-weight: 400; border: 2px solid #303038; padding: 2px; }
    .gba-side-btn.active { background: #f8e8d8; border-color: #c87870; }
    .turn-badge { font-size: 18px; font-weight: 400; letter-spacing: 0; transform: none; padding: 4px 12px; }
    .seat-sub-btn-cute { font-size: 20px; font-weight: 400; letter-spacing: 0; padding: 4px 10px; text-shadow: none; }
    .seat-sub-btn-cute.playing-active { text-shadow: none !important; box-shadow: 2px 2px 0 #283830 !important; }
    .perspective-switcher-corner { box-shadow: 2px 2px 0 #182028; border-width: 2px; }
    .view-btn { font-size: 14px; font-weight: 400; }
    .perspective-title { font-size: 14px; }
    .view-btn.active, .view-btn.view-spec.active, .view-btn.view-p1.active, .view-btn.view-p2.active { box-shadow: none; transform: none; }
    .gba-bag-drawer { max-height: 96px; padding: 5px; gap: 5px; background: #f8f8f0; border: 2px solid #303038; }
    .gba-item-name { font-size: 16px; font-weight: 400; }
    .gba-item-desc, .gba-item-tag, .gba-item-count { font-size: 13px; }
    .gba-item-use-btn { font-size: 14px; font-weight: 400; border-radius: 0; }

      .hp-box-opponent, .hp-box-player { padding: 4px 8px 3px; }
      .hp-box-header { gap: 3px; margin-bottom: 2px; }
      .pokemon-title, .hp-numbers-display { font-size: 18px; }
      .level-badge { font-size: 18px; }
      .gender-badge { font-size: 12px; }

      .exp-footer-tab { height: 7px; margin-left: 20px; gap: 4px; }

      .seat-sub-btn-cute { font-size: 14px; padding: 2px 6px; gap: 3px; margin: 0 auto; line-height: 1; transform: none; }
      .seat-sub-btn-cute:hover:not(:disabled) { transform: translateY(-1px); }
      .seat-sub-btn-cute:active:not(:disabled) { transform: translate(1px, 1px); }
      .seat-join-icon { font-size: 11px; }
      .gba-deck-outer { padding: 2px; }
      .gba-deck-frame { padding: 3px; gap: 3px; min-height: 0; }
      .deck-play-center { gap: 3px; }
      .gba-moves-panel, .gba-stats-panel { padding: 3px; }
      .gba-moves-panel { gap: 1px 2px; }
      .gba-move-item, .gba-move-item.selected { padding: 3px 4px; min-height: 26px; }
      .gba-move-text { font-size: 19px; }
      .gba-stats-panel { width: 80px; min-width: 80px; gap: 1px; }
      .gba-pp-row { gap: 4px; }
      .gba-pp-label, .gba-pp-val, .gba-type-badge { font-size: 18px; }
      .gba-strike-btn { font-size: 12px; padding: 2px 0; margin-top: 1px; }
      .gba-side-actions { width: 38px; gap: 3px; }
      .gba-side-btn { font-size: 14px; }
      .gba-bag-drawer { max-height: 66px; padding: 3px; gap: 3px; }
      .gba-item-name { font-size: 13px; }
      .gba-item-desc, .gba-item-tag, .gba-item-count { font-size: 11px; }
      .gba-item-use-btn { font-size: 12px; }
    }
    @media (max-width: 360px) {
      .pokemon-title, .level-badge { font-size: 16px; }
      .gba-move-text { font-size: 17px; }
      .gba-stats-panel { min-width: 72px; width: 72px; }
    }

    @media(max-width:600px),(max-height:380px){.move-heading{left:6px;font-size:15px;padding:2px 9px 1px;gap:8px;border-radius:11px 11px 0 0;}}
    .battle-top #nextAction.pixel-panel {max-height:none;overflow:visible;}
    #nextAction .action-queue {max-height:calc(32vh - 19px);overflow:auto;scrollbar-width:thin;}
    #commandDeck[hidden] {display:none!important;}
    .pixel-panel {position:relative;isolation:isolate;--pixel-border:2px;}
    #nextAction.pixel-panel,.direction-wait.pixel-panel,.battle-announcement-card.pixel-panel {border:0;background:#303830;box-shadow:none;}
    .pixel-panel::after {content:'';position:absolute;inset:var(--pixel-border);z-index:-1;background:#f8f8e0;clip-path:polygon(0 4px,2px 4px,2px 2px,4px 2px,4px 0,calc(100% - 4px) 0,calc(100% - 4px) 2px,calc(100% - 2px) 2px,calc(100% - 2px) 4px,100% 4px,100% calc(100% - 4px),calc(100% - 2px) calc(100% - 4px),calc(100% - 2px) calc(100% - 2px),calc(100% - 4px) calc(100% - 2px),calc(100% - 4px) 100%,4px 100%,4px calc(100% - 2px),2px calc(100% - 2px),2px calc(100% - 4px),0 calc(100% - 4px));pointer-events:none;}
    .battle-announcement-card.pixel-panel {--pixel-border:3px;}
    @media(max-width:600px),(max-height:380px){.battle-announcement-card.pixel-panel {--pixel-border:2px;}}
  </style>
</head>
<body>
  <div class="handheld-stage">
    <div class="battle-top">
      <div class="battle-status-stack">
        <div id="battleIntro" class="battle-intro" aria-hidden="true" hidden><div class="intro-matchup"><span id="introRed"></span><strong>VS</strong><span id="introBlue"></span></div></div>
        <div id="directionWait" class="direction-wait pixel-panel pixel-cut-hp" role="status" hidden><span class="preparing-dot" aria-hidden="true"></span><span id="directionWaitText"></span></div>
      </div>
    <!-- Top Bar: Turn Notification Banner with Off-White BG and Stepped Pixel Corners -->
    <div class="top-control-bar">
      <section id="nextAction" class="pixel-panel pixel-cut-hp" aria-label="Battle action queue" aria-live="polite" aria-atomic="false">
        <div class="queue-heading">QUEUE <span id="queueCount">0</span></div>
        <ol id="actionQueue" class="action-queue"></ol>
        <p id="queueEmpty">WAITING FOR TRAINERS</p>
      </section>
    </div>
    </div>
    <div id="battleAnnouncement" class="battle-announcement" role="status" aria-live="polite" aria-atomic="true" hidden>
      <button type="button" class="battle-announcement-card pixel-panel pixel-cut-hp" id="announcementContinue" aria-label="Continue battle message"><span id="battleAnnouncementText"></span></button>
    </div>

    <!-- Battle Stage with Opponent (Top-Left) and Player (Bottom-Right) -->
    <div class="battle-hud-area">
      <div class="practice-tools" id="practiceTools" hidden><button id="playBothBtn" type="button" hidden>PLAY BOTH</button><button id="changePokemon" type="button" hidden>BACK</button></div>
      <!-- Opponent Column (Top-Left) -->
      <div class="trainer-column-opponent">
        <!-- REVAMPED COMPACT JOIN BUTTON FOR TRAINER 1 (ABOVE HP CONTAINER) -->
        <div class="trainer-controls">
        <button class="seat-sub-btn-cute trainer-red-btn pixel-cut-stepped interactive" id="oppSeatBtn">
          <span class="seat-join-icon">▶</span>
          <span id="oppSeatBtnText">PLAY AS RED</span>
        </button>
          <button type="button" class="trainer-leave" id="redLeave" aria-label="Leave red trainer" title="Leave red trainer" hidden>×</button>
        </div>

        <div class="hp-card-wrapper interactive">
          <div class="hp-shadow-plate hp-shadow-opp pixel-cut-hp"></div>
          <div class="hp-box-opponent pixel-cut-hp interactive" id="oppBox">
            <div class="hp-box-header">
              <div class="pokemon-title">
                <span id="oppName">BLASTOISE</span>
                <span class="gender-badge gender-male" id="oppGender">♂</span>
              </div>
              <div class="level-badge" id="oppLevel">Lv: 50</div>
            </div>
            <div class="hp-gauge-integrated">
              <span class="hp-label-integrated">HP</span>
              <div class="hp-track-integrated">
                <div class="hp-fill" id="oppHpFill" style="width: 100%;"></div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Player Column (Bottom-Right) -->
      <div class="trainer-column-player">
        <!-- REVAMPED COMPACT JOIN BUTTON FOR TRAINER 2 (ABOVE HP CONTAINER) -->
        <div class="trainer-controls">
        <button class="seat-sub-btn-cute trainer-blue-btn pixel-cut-stepped interactive" id="playerSeatBtn">
          <span class="seat-join-icon">▶</span>
          <span id="playerSeatBtnText">PLAY AS BLUE</span>
        </button>
          <button type="button" class="trainer-leave" id="blueLeave" aria-label="Leave blue trainer" title="Leave blue trainer" hidden>×</button>
        </div>

        <div class="hp-box-player-wrapper interactive" id="playerBox">
          <div class="hp-shadow-plate hp-shadow-player"></div>
          <div class="hp-box-player pixel-cut-hp" id="playerBoxInner">
            <div class="hp-box-header">
              <div class="pokemon-title">
                <span id="playerName">CHARIZARD</span>
                <span class="gender-badge gender-male" id="playerGender">♂</span>
              </div>
              <div class="level-badge" id="playerLevel">Lv: 50</div>
            </div>
            <div class="hp-gauge-integrated">
              <span class="hp-label-integrated">HP</span>
              <div class="hp-track-integrated">
                <div class="hp-fill" id="playerHpFill" style="width: 100%;"></div>
              </div>
            </div>
            <div class="hp-numbers-display" id="playerHpNumbers">135/ 135</div>
          </div>
          <!-- EXP Footer Tab -->
          <div class="exp-footer-tab pixel-cut-hp">
            <span class="exp-label">EXP</span>
            <div class="exp-track">
              <div class="exp-fill" id="playerExpFill" style="width: 0%;"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- GBA Lower Deck with Low-Pixel Stepped Corners -->
    <div class="gba-deck-outer pixel-cut-stepped interactive" id="commandDeck">
      <div id="commandError" class="command-error" role="alert" hidden></div>
      <div id="moveHeading" class="move-heading"><span id="movePokemonName"></span><span id="commandTimer" role="timer" aria-label="Time to choose an attack"></span></div>
      <div class="gba-deck-frame pixel-cut-stepped">
        <!-- Central Battle Play Area: Exactly 2 text rows tall -->
        <div class="deck-play-center" id="battlePanel">
          <!-- 2x2 Moves Grid with Red Highlight Box -->
          <div class="gba-moves-panel pixel-cut-stepped" id="movesPanel"></div>

          <!-- Move Specs & Strike Confirmation (Minimum Width) -->
          <div class="gba-stats-panel pixel-cut-stepped" id="statsPanel">
            <div class="gba-pp-row">
              <span class="gba-pp-label" id="statLabel">PP</span>
              <span class="gba-pp-val" id="statPpVal">--/--</span>
            </div>
            <div class="gba-type-row">
              <span class="gba-pp-label">TYPE</span>
              <span class="gba-type-badge type-NORMAL" id="statTypeBadge">NORMAL</span>
            </div>
            <div id="selectionDetail" class="selection-detail" hidden></div>
            <button class="gba-strike-btn" id="attackBtn" onclick="confirmSelectedMove()">STRIKE</button>
          </div>
        </div>

        <!-- Bag Drawer -->
        <div class="gba-bag-drawer pixel-cut-stepped" id="bagDrawer"></div>

        <!-- Side Action Bar: Vertical FIGHT, BAG -->
        <div class="gba-side-actions">
          <button class="gba-side-btn active" id="btnFight" onclick="setDeckMode('fight')">FIGHT</button>
          <button class="gba-side-btn" id="btnBag" onclick="setDeckMode('bag')">BAG</button>
        </div>
      </div>
    </div>
  </div>

    }
    function renderStatus() {
      var remaining = Math.max(0,Math.ceil((Number(currentGame.deadline || 0) - serverClock()) / 1000));
      var active = playerState.seats.find(function(seat) {return seat.actorId === currentGame.activeTurnActorId;});
      renderActionQueue(active);renderCommandTimer();
      el('oppBox').classList.toggle('active-turn-ring',!!(active&&active.actorId===((playerState.seats.find(function(s){return s.id==='trainer_red';}))||{}).actorId));
      el('playerBoxInner').classList.toggle('active-turn-ring',!!(active&&active.actorId===((playerState.seats.find(function(s){return s.id==='trainer_blue';}))||{}).actorId));
      if(canPractice())renderStats();
      if(!currentGame.sequentialTurns&&currentGame.phase==='battle'&&currentGame.deadline&&remaining===0)el('attackBtn').disabled=true;
    }
    function renderGame() {
      var seats=playerState.seats||[];
      var red=seats.find(function(s){return s.id==='trainer_red';})||{id:'trainer_red'};
      var blue=seats.find(function(s){return s.id==='trainer_blue';})||{id:'trainer_blue'};
      mySeat=seats.find(function(s){return s.canRelease;})||null;
      var fighters=currentGame.fighters||{};myFighter=mySeat?fighters[mySeat.actorId]:null;
      if(mySeat)currentPerspective=mySeat.id==='trainer_red'?'p1':'p2';
      if(previousActor!==(mySeat?mySeat.actorId:'') || previousBattle!==currentGame.battleNumber){selectedPokemonIndex=null;selectedMoveIndex=0;bagPage=0;previousActor=mySeat?mySeat.actorId:'';previousBattle=currentGame.battleNumber;pokemonPage=myFighter?Math.floor(myFighter.pokemonIndex/4):0;choosingPokemon=!(myFighter&&myFighter.sentOut);}
      if(myFighter&&myFighter.chargingMove)selectedMoveIndex=myFighter.chargingMove.index;
      var ownDisplay=fighters[blue.actorId];
      var opponent=fighters[red.actorId];
      displayedFighter=myFighter||fighters[currentGame.activeTurnActorId]||ownDisplay||opponent;
      var visibleFighters=shownGame().fighters||fighters;renderCard('opp',visibleFighters[red.actorId]);renderCard('player',visibleFighters[blue.actorId]);
      renderSeat('oppSeatBtn','oppSeatBtnText',red,0);renderSeat('playerSeatBtn','playerSeatBtnText',blue,1);

      el('battlePanel').style.display=deckMode==='fight'?'flex':'none';el('bagDrawer').style.display=deckMode==='bag'?'grid':'none';
      el('btnFight').classList.toggle('active',deckMode==='fight');el('btnBag').classList.toggle('active',deckMode==='bag');
      var battle=['battle','animating'].includes(currentGame.phase);
      el('btnFight').textContent=battle?'FIGHT':'PRACTICE';el('btnFight').classList.toggle('practice-label',!battle);
      var otherOpen=mySeat&&(playerState.seats||[]).some(function(s){return !s.actorId&&s.canClaim;});
      el('practiceTools').hidden=!(canPractice()||otherOpen);
      el('playBothBtn').hidden=!otherOpen;el('playBothBtn').disabled=busy;
      el('changePokemon').hidden=!canPractice();el('changePokemon').textContent=choosingPokemon?'BACK':'POKÉMON';el('changePokemon').disabled=busy;
      el('moveHeading').hidden=!showMoveMenu();el('movePokemonName').textContent=displayedFighter?displayedFighter.name:'';
      if(showMoveMenu())renderMoves();else renderLobby();
      el('commandDeck').hidden=!commandMenuVisible();
      el('commandDeck').classList.toggle('selecting',!showMoveMenu());
      renderStats();if(deckMode==='bag')renderBag();renderStatus();renderAnnouncements();renderFreshOpening();
      var action=shownGame().lastAction;
      if(action&&action.id!==previousAction){previousAction=action.id;if(action.damage>0){var box=action.opponentId===blue.actorId?el('playerBoxInner'):el('oppBox');box.classList.add('hp-hit');setTimeout(function(){box.classList.remove('hp-hit');},400);}}
      if(!el('battleHistory').hidden)renderHistory();
      followActiveTrainer();
    }
    function renderHistory() {
      var log=el('battleHistoryLines');log.replaceChildren();
      (shownGame().battleLog||['Connecting to the shared arena...']).forEach(function(line){var p=document.createElement('p');p.textContent=line;log.appendChild(p);});
      log.scrollTop=log.scrollHeight;
    }
    function openBattleHistory() {renderHistory();el('battleHistory').hidden=false;document.body.classList.add('history-open');el('historyClose').focus();}
    function closeBattleHistory() {el('battleHistory').hidden=true;document.body.classList.remove('history-open');el('btnFight').focus();}
    document.addEventListener('keydown',function(event){if(event.key==='Escape'&&!el('battleHistory').hidden)closeBattleHistory();});
    document.addEventListener('keydown',function(event){
      if(event.altKey||event.ctrlKey||event.metaKey||!el('battleHistory').hidden||busy)return;
      var key=event.key;
      if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(key)&&deckMode==='fight'&&myFighter){
        event.preventDefault();var offset=key==='ArrowLeft'?-1:key==='ArrowRight'?1:key==='ArrowUp'?-2:2;
        if(beforeBattle()&&!showMoveMenu()){var count=(currentGame.pokemonChoices||[]).length;selectedPokemonIndex=((selectedPokemonIndex===null?myFighter.pokemonIndex:selectedPokemonIndex)+offset+count)%count;pokemonPage=Math.floor(selectedPokemonIndex/4);renderLobby();renderStats();}
        else {var count=cachedMoves.length;if(count)chooseMove((selectedMoveIndex+offset+count)%count);}
      }else if((key==='z'||key==='Z')&&deckMode==='fight'){event.preventDefault();confirmSelectedMove();}
      else if(key==='Escape'&&canPractice()&&choosingPokemon){choosingPokemon=false;renderGame();}
    });
    if(window.Genesis&&Genesis.on){
      Genesis.on('state',function(){currentGame=Genesis.state.get()||{};playerState=Genesis.players&&Genesis.players.get?Genesis.players.get():{seats:[]};renderGame();});
      if(Genesis.players&&Genesis.players.subscribe)Genesis.players.subscribe(function(){playerState=Genesis.players.get();renderGame();});
    }
    renderGame();
    setInterval(function(){renderStatus();if(!busy&&playerState.cooldownUntil>Date.now()){
      var seats=playerState.seats||[];renderSeat('oppSeatBtn','oppSeatBtnText',seats[0]||{id:'trainer_red'},0);renderSeat('playerSeatBtn','playerSeatBtnText',seats[1]||{id:'trainer_blue'},1);
    }},250);
  </script>
</body>
</html>
