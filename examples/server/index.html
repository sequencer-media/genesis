<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Genesis world server</title>
  <style>
    *{box-sizing:border-box}body{margin:0;background:#101c18;color:#e9eddf;font:15px system-ui}main{max-width:1120px;margin:auto;padding:24px 16px}h1{font-size:24px}p{line-height:1.5;color:#bac8b0}form{display:flex;gap:10px;flex-wrap:wrap;margin:24px 0}label{flex:1;min-width:220px}input{width:100%;margin-top:6px}input,button{padding:12px;font:inherit;border:1px solid #71816b;background:#23352b;color:inherit;border-radius:6px}button{align-self:end;cursor:pointer}button:disabled{opacity:.5}.genesis-player{border:1px solid #52634b;background:#172a21}.genesis-stage{position:relative;aspect-ratio:16/9}.genesis-stage img,.genesis-stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.genesis-overlay{position:absolute;inset:0}.genesis-overlay iframe{width:100%;height:100%;border:0;background:transparent}.genesis-panel iframe{width:100%;height:760px;border:0}.genesis-controls{display:flex;gap:8px;padding:12px;flex-wrap:wrap}.genesis-controls:empty{display:none}.genesis-status{padding:0 12px}[hidden]{display:none!important}@media(max-width:600px){main{padding:12px 6px}h1{font-size:20px}}
  </style>
</head>
<body><main>
  <h1 id="title">Genesis world server</h1>
  <button id="leave" hidden>Leave world</button>
  <p id="message" role="status">Enter the access token your host gave you. Each token identifies one player.</p>
  <form id="login"><label>Room access token<input id="token" type="password" required autocomplete="off" spellcheck="false"></label><button>Join world</button></form>
  <div id="player"></div>
</main><script type="module" src="/client.js"></script></body>
</html>
