<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{margin:0;width:100%;height:100%;background:transparent;color:#fafafa;font:14px system-ui}*{box-sizing:border-box}.panel{position:absolute;bottom:16px;left:16px;right:16px;background:#111113ed;border:1px solid #3f3f46;border-radius:18px;padding:16px}button{font:inherit;cursor:pointer;border-radius:999px;border:1px solid #52525b;background:#fafafa;color:#09090b;padding:10px 18px}button:disabled{opacity:.45;cursor:default}.choices{display:flex;gap:8px;flex-wrap:wrap}.note{color:#a1a1aa;font-size:12px;margin:8px 0}.meter{height:16px;background:#3f3f46;border-radius:20px;position:relative;overflow:hidden;margin:16px 0}.needle{width:4px;background:#fafafa;height:100%;position:absolute}input{accent-color:#fafafa;width:100%}.hidden{display:none}</style></head><body><div class="panel"><strong>Time your shot</strong><div id="score" class="note"></div><label>Aim<input id="aim" type="range" min="-1" max="1" step=".01" value=".65"></label><div class="meter"><div id="needle" class="needle"></div></div><button id="shoot">Start timing</button><p id="note" class="note">Stop the marker near the center.</p></div><script>const button=document.getElementById('shoot'),needle=document.getElementById('needle'),note=document.getElementById('note');let running=false,start=0,marker=.5,challenge='';const reducedMotion=matchMedia('(prefers-reduced-motion: reduce)').matches;
function animate(now){if(running){marker=(now-start)%1800/1800;needle.style.left=(marker*100)+'%';}requestAnimationFrame(animate);}requestAnimationFrame(animate);
Genesis.on('state',view=>{const data=view.genesis?.state||{};challenge=data.challengeId;button.disabled=!Genesis.actions.get('shot').canSubmit;document.getElementById('score').textContent=(view.participants||[]).filter(p=>p.role==='player').map(p=>p.name+': '+((data.scores||{})[p.id]||0)).join(' · ')+' · '+(data.lastResult||'Ready');document.querySelector('.panel').style.transition='opacity .2s';document.querySelector('.panel').style.opacity=view.genesis?.stage.overlays?'1':'0';if(button.disabled)running=false;});
if(reducedMotion){button.textContent='Shoot';note.textContent='Choose your aim, then shoot. Timing is assisted.';}button.onclick=()=>{if(!running&&!reducedMotion){running=true;start=performance.now();button.textContent='Shoot';return;}running=false;button.textContent='Start timing';Genesis.action('shot',{challengeId:challenge,aimX:Number(document.getElementById('aim').value),power:.75,timingOffsetMs:reducedMotion?0:Math.round((marker-.5)*1800)}).catch(e=>note.textContent=e.message);};</script></body></html>
